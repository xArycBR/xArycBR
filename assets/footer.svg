<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="title desc">
  <title id="title">Software com clareza. Produto com impacto.</title>
  <desc id="desc">Rodapé animado da identidade visual de Gabriel Almeida.</desc>
  <defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient></defs>
  <style>
    .line{stroke-dasharray:12 20;animation:dash 12s linear infinite}.dot{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes dash{to{stroke-dashoffset:-260}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
    @media(prefers-reduced-motion:reduce){.line,.dot{animation:none}}
  </style>
  <rect width="1200" height="120" rx="20" fill="#0A0F18"/>
  <path class="line" d="M90 60H1110" stroke="url(#line)" stroke-width="2"/>
  <circle class="dot" cx="600" cy="60" r="5" fill="#22D3EE"/>
  <rect x="386" y="35" width="428" height="50" rx="25" fill="#0A0F18" stroke="#25394A"/>
  <text x="600" y="66" text-anchor="middle" fill="#DCEAF3" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" letter-spacing="1.2">SOFTWARE COM CLAREZA · PRODUTO COM IMPACTO</text>
  <rect x=".75" y=".75" width="1198.5" height="118.5" rx="19.25" fill="none" stroke="#26384A" stroke-width="1.5"/>
</svg>
