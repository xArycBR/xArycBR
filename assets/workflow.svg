<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de engenharia de produto</title>
  <desc id="desc">Fluxo animado do contexto ao resultado em produção.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#0A0F18"/><stop offset="1" stop-color="#0B1620"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset="0.55" stop-color="#3B82F6"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .track { stroke-dasharray:8 13; animation:move 10s linear infinite; }
    .step { animation:step 5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .s2{animation-delay:-1.25s}.s3{animation-delay:-2.5s}.s4{animation-delay:-3.75s}
    @keyframes move{to{stroke-dashoffset:-210}}
    @keyframes step{0%,100%{opacity:.72;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
    @media (prefers-reduced-motion: reduce){.track,.step{animation:none}}
  </style>
  <rect width="1200" height="250" rx="22" fill="url(#bg)"/>
  <path d="M150 125H1050" stroke="#23384A" stroke-width="3" stroke-linecap="round"/>
  <path class="track" d="M150 125H1050" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <circle r="6" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M150 125H1050"/></circle>

  <g class="step">
    <rect x="72" y="64" width="220" height="122" rx="20" fill="#0D1A25" stroke="#274458"/>
    <text x="96" y="95" fill="#22D3EE" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">01 · CONTEXTO</text>
    <text x="96" y="130" fill="#F1F8FC" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Entender</text>
    <text x="96" y="154" fill="#8DA3B5" font-family="Segoe UI,Arial,sans-serif" font-size="12">negócio, usuário e restrições</text>
  </g>
  <g class="step s2">
    <rect x="351" y="64" width="220" height="122" rx="20" fill="#0D1A25" stroke="#274458"/>
    <text x="375" y="95" fill="#48BDF8" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">02 · ARQUITETURA</text>
    <text x="375" y="130" fill="#F1F8FC" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Estruturar</text>
    <text x="375" y="154" fill="#8DA3B5" font-family="Segoe UI,Arial,sans-serif" font-size="12">fluxos, estados e componentes</text>
  </g>
  <g class="step s3">
    <rect x="630" y="64" width="220" height="122" rx="20" fill="#0D1A25" stroke="#274458"/>
    <text x="654" y="95" fill="#6E9CF9" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">03 · EXECUÇÃO</text>
    <text x="654" y="130" fill="#F1F8FC" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Construir</text>
    <text x="654" y="154" fill="#8DA3B5" font-family="Segoe UI,Arial,sans-serif" font-size="12">interface, integração e qualidade</text>
  </g>
  <g class="step s4">
    <rect x="909" y="64" width="220" height="122" rx="20" fill="#0D1A25" stroke="#274458"/>
    <text x="933" y="95" fill="#34D399" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">04 · RESULTADO</text>
    <text x="933" y="130" fill="#F1F8FC" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Evoluir</text>
    <text x="933" y="154" fill="#8DA3B5" font-family="Segoe UI,Arial,sans-serif" font-size="12">produção, feedback e impacto</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="248.5" rx="21.25" fill="none" stroke="#26384A" stroke-width="1.5"/>
</svg>
