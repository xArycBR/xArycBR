<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de atuação de Gabriel Almeida</title>
  <desc id="desc">Grafo animado conectando produto, front-end, experiência e engenharia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F18"/><stop offset="1" stop-color="#0C1622"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .edge { stroke-dasharray: 4 10; animation: travel 8s linear infinite; }
    .edge.r { animation-direction: reverse; animation-duration: 11s; }
    .node { animation: breathe 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .node.d1 { animation-delay: -1s; }.node.d2 { animation-delay: -2s; }.node.d3 { animation-delay: -3s; }
    @keyframes travel { to { stroke-dashoffset: -140; } }
    @keyframes breathe { 0%,100% { opacity:.78; transform:scale(.98) } 50% { opacity:1; transform:scale(1.02) } }
    @media (prefers-reduced-motion: reduce) { .edge,.node { animation:none; } }
  </style>

  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <path d="M600 210L300 112M600 210L900 112M600 210L300 308M600 210L900 308" fill="none" stroke="#31465A" stroke-width="2"/>
  <path class="edge" d="M600 210L300 112M600 210L900 112" fill="none" stroke="url(#line)" stroke-width="2"/>
  <path class="edge r" d="M600 210L300 308M600 210L900 308" fill="none" stroke="url(#line)" stroke-width="2"/>

  <g fill="#22D3EE" filter="url(#glow)">
    <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" path="M600 210L300 112"/></circle>
    <circle r="4"><animateMotion dur="4.8s" repeatCount="indefinite" path="M600 210L900 112"/></circle>
    <circle r="4"><animateMotion dur="5.2s" repeatCount="indefinite" path="M300 308L600 210"/></circle>
    <circle r="4"><animateMotion dur="4.4s" repeatCount="indefinite" path="M900 308L600 210"/></circle>
  </g>

  <g class="node">
    <rect x="435" y="146" width="330" height="128" rx="24" fill="#0E2130" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="494" cy="185" r="11" fill="#22D3EE" opacity="0.16"/>
    <circle cx="494" cy="185" r="4" fill="#22D3EE"/>
    <text x="520" y="191" fill="#7DE9F7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.7">PONTO DE CONVERGÊNCIA</text>
    <text x="600" y="230" text-anchor="middle" fill="#F4FAFF" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Engenharia que gera valor</text>
    <text x="600" y="255" text-anchor="middle" fill="#8FA5B7" font-family="Segoe UI, Arial, sans-serif" font-size="13">do problema de negócio à experiência entregue</text>
  </g>

  <g class="node d1">
    <rect x="135" y="55" width="330" height="114" rx="20" fill="#0D1824" stroke="#28445B"/>
    <rect x="157" y="77" width="40" height="40" rx="12" fill="#102D3B"/>
    <path d="M170 98h14M177 91v14" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
    <text x="215" y="98" fill="#F0F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Produto</text>
    <text x="215" y="124" fill="#8EA3B5" font-family="Segoe UI, Arial, sans-serif" font-size="13">contexto, prioridade e resultado</text>
  </g>

  <g class="node d2">
    <rect x="735" y="55" width="330" height="114" rx="20" fill="#0D1824" stroke="#28445B"/>
    <rect x="757" y="77" width="40" height="40" rx="12" fill="#10273E"/>
    <path d="M769 91l-6 6 6 6M785 91l6 6-6 6" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="815" y="98" fill="#F0F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Front-end</text>
    <text x="815" y="124" fill="#8EA3B5" font-family="Segoe UI, Arial, sans-serif" font-size="13">interfaces, performance e escala</text>
  </g>

  <g class="node d3">
    <rect x="135" y="251" width="330" height="114" rx="20" fill="#0D1824" stroke="#28445B"/>
    <rect x="157" y="273" width="40" height="40" rx="12" fill="#16243B"/>
    <circle cx="177" cy="293" r="8" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="177" cy="293" r="2.5" fill="#8B5CF6"/>
    <text x="215" y="294" fill="#F0F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Experiência</text>
    <text x="215" y="320" fill="#8EA3B5" font-family="Segoe UI, Arial, sans-serif" font-size="13">clareza, fluxo e confiança</text>
  </g>

  <g class="node">
    <rect x="735" y="251" width="330" height="114" rx="20" fill="#0D1824" stroke="#28445B"/>
    <rect x="757" y="273" width="40" height="40" rx="12" fill="#122B38"/>
    <path d="M767 299l10-13 10 13M768 299h18" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="815" y="294" fill="#F0F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Engenharia</text>
    <text x="815" y="320" fill="#8EA3B5" font-family="Segoe UI, Arial, sans-serif" font-size="13">qualidade, manutenção e evolução</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="21.25" fill="none" stroke="#26384A" stroke-width="1.5"/>
</svg>
